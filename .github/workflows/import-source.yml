name: Import Manuscript Watch v0.1.8 source
on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/part-04.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part-*.b64 | base64 --decode > /tmp/manuscript-watch-source.tar.xz
          echo "7312f683bd1384445197cd27de1f408bcfe3f9cccd6dc5e9894da7cdcc399ba9  /tmp/manuscript-watch-source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/manuscript-watch-source.tar.xz -C .
          test -f app/build.gradle.kts
          test -f app/src/main/java/org/manuscriptwatch/app/SpringerWebMonitor.kt
          test -f .github/workflows/build-apk.yml
          rm -rf bootstrap
      - name: Publish extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Import Manuscript Watch v0.1.8 Android source'
          git push origin HEAD:main
