name: Import Manuscript Watch v0.1.8 source
on:
  push:
    branches: [main]
    paths:
      - 'ManuscriptWatch-v0.1.8-GitHub-public-ready.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f ManuscriptWatch-v0.1.8-GitHub-public-ready.zip
          echo "5054d743cdd853ab5bf55837428ef9ab130788fe6d60e8ffad9c5a888f371265  ManuscriptWatch-v0.1.8-GitHub-public-ready.zip" | sha256sum -c -
          unzip -q ManuscriptWatch-v0.1.8-GitHub-public-ready.zip -d .
          test -f app/build.gradle.kts
          test -f app/src/main/java/org/manuscriptwatch/app/SpringerWebMonitor.kt
          test -f .github/workflows/build-apk.yml
          rm -f ManuscriptWatch-v0.1.8-GitHub-public-ready.zip
      - name: Publish extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Import Manuscript Watch v0.1.8 Android source'
          git push origin HEAD:main
