name: Publish v0.2.2 source release

on:
  push:
    branches: [main]
    paths:
      - 'RELEASE_NOTES_0_2_2.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish source-only release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Require stable version
        shell: bash
        run: |
          version=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          if [ "$version" != "0.2.2" ]; then
            echo "Expected versionName 0.2.2, got: $version"
            exit 1
          fi
          test -s RELEASE_NOTES_0_2_2.md

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Compile Android APK for verification only
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish GitHub source release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.2.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.2.2 already published; nothing to do."
            exit 0
          fi
          gh release create v0.2.2 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Manuscript Watch v0.2.2" \
            --notes-file RELEASE_NOTES_0_2_2.md \
            --latest
