name: Publish Manuscript Watch v0.2.0 source release

on:
  push:
    branches: [main]
    paths:
      - "RELEASE_NOTES_0_2_0.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manuscript-watch-v0.2.0-source-release
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish tagged source code
    if: github.repository == 'Orbolato/Submission-Tracker-App' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Check intended version and release files
        shell: bash
        run: |
          grep -Fq 'versionName = "0.2.0"' app/build.gradle.kts
          grep -Fq 'versionCode = 17' app/build.gradle.kts
          test -s RELEASE_NOTES_0_2_0.md
          test -s RELEASE_SIGNING.md

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify tests and APK compilation
        run: |
          gradle --no-daemon :app:testDebugUnitTest
          gradle --no-daemon :app:assembleDebug

      - name: Publish source-only GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view v0.2.0 >/dev/null 2>&1; then
            echo "Release v0.2.0 already exists; not modifying it."
            exit 0
          fi
          gh release create v0.2.0 \
            --target "$GITHUB_SHA" \
            --title "Manuscript Watch v0.2.0" \
            --notes-file RELEASE_NOTES_0_2_0.md
          echo "Published tagged source-only v0.2.0 release."
